<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "LocalBusiness",
  "name": "{{site_nome}}",
  "description": "Execução de pisos industriais de alta resistência: epóxi autonivelante, poliuretano cimentício, antiderrapante multicamada, proteção química, demarcação e recuperação de pisos.",
  "telephone": "{{telefone_link}}",
  "email": "{{email}}",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "{{endereco_rua}}",
    "addressLocality": "{{cidade}}",
    "addressRegion": "SP",
    "addressCountry": "BR"
  },
  "openingHoursSpecification": [{
    "@type": "OpeningHoursSpecification",
    "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"],
    "opens": "08:00", "closes": "18:00"
  }],
  "areaServed": [
    { "@type": "State", "name": "São Paulo" },
    { "@type": "State", "name": "Minas Gerais" },
    { "@type": "State", "name": "Paraná" },
    { "@type": "State", "name": "Santa Catarina" }
  ]
}
</script>
